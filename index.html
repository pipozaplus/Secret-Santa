<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizli Şaxta Baba 🎅✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0b132b; --card-bg: rgba(255, 255, 255, 0.07); --card-border: rgba(255, 255, 255, 0.15); --gold: #ffd166; --red: #ef476f; --text: #ffffff; --text-muted: #a0aec0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        #snowCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .container { position: relative; z-index: 2; width: 100%; max-width: 420px; padding: 20px; text-align: center; }
        .card { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 24px; padding: 28px 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        .btn-primary { background-color: var(--red); color: white; }
        .btn-restart { background-color: #4a4e69; color: white; margin-bottom: 20px; }
        .hidden { display: none; }
        .player-badge { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; margin-bottom: 8px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <canvas id="snowCanvas"></canvas>

    <div class="container">
        <h1>Gizli Şaxta Baba 🎅</h1>

        <!-- ЭКРАН ВХОДА -->
        <main class="card" id="auth-section">
            <input type="text" id="username" placeholder="Ləqəbiniz (məs. Elvin 🎄)" style="width: 100%; padding: 14px; background: rgba(0,0,0,0.25); border: 1px solid var(--card-border); border-radius: 12px; color: #fff; margin-bottom: 15px; outline: none;">
            <button class="btn btn-primary" onclick="createRoom()">🎁 Otaq yarat</button>
        </main>

        <!-- ЛОББИ -->
        <main class="card hidden" id="lobby-section">
            <!-- Кнопка Рестарт (видна после начала игры) -->
            <button id="restart-btn" class="btn btn-restart hidden" onclick="restartGame()">🔄 Oyunu yenidən başlat</button>
            
            <h2 id="lobby-title" style="color: var(--gold); margin-bottom: 10px;">Otaq: ---</h2>
            <div id="player-list" style="margin-bottom: 20px;"></div>

            <button id="start-btn" class="btn btn-primary" onclick="startDrawing()">🚀 Oyunu başlat</button>
        </main>
    </div>

    <script>
        // Имитация базы данных (временно)
        let players = ["Aysel 🌸", "Elvin 🎄", "Murad 🎁", "Leyla ✨"]; // Список для примера
        let isStarted = false;

        function createRoom() {
            const name = document.getElementById('username').value.trim();
            if (!name) return alert('Ləqəbi daxil et!');
            players.push(name + " (Siz)");
            
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('lobby-section').classList.remove('hidden');
            updatePlayerList();
        }

        function updatePlayerList() {
            const list = document.getElementById('player-list');
            list.innerHTML = players.map(p => `<div class="player-badge">${p}</div>`).join('');
        }

        function startDrawing() {
            // Алгоритм рандома с проверкой: никто не получает себя
            let targets = [...players];
            let shuffled;
            
            do {
                shuffled = [...targets].sort(() => Math.random() - 0.5);
            } while (shuffled.some((target, i) => target === players[i]));

            // Показываем результат
            const list = document.getElementById('player-list');
            list.innerHTML = players.map((p, i) => `
                <div class="player-badge">
                    <strong>${p}</strong> → ${shuffled[i]}
                </div>
            `).join('');

            // Меняем интерфейс
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('restart-btn').classList.remove('hidden');
            document.getElementById('lobby-title').innerText = "Nəticələr:";
        }

        function restartGame() {
            document.getElementById('start-btn').classList.remove('hidden');
            document.getElementById('restart-btn').classList.add('hidden');
            document.getElementById('lobby-title').innerText = "Otaq: #12345";
            updatePlayerList();
        }
    </script>
</body>
</html>
